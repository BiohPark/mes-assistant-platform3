openapi: 3.1.0
info:
  title: MES Agent Hub API (초안)
  version: 0.1.0-draft
  description: |
    새 저장소 서버 API 초안. 데모의 저장소 함수(src/db/repositories/*)와 1:1로 대응한다(docs/architecture/data-contract.md §6).
    인증은 사내 SSO 세션 쿠키. 역할: member(담당자), system_owner, requester.
    오류는 공통 Problem 형식. 409는 규칙 위반(진행 중 요청, 참조 중 삭제, 완료된 대화 변경 등).
servers:
  - url: /api
security:
  - session: []

tags:
  - name: auth
  - name: assistants
  - name: tasks
  - name: materials
  - name: requests
  - name: files
  - name: service-requests
  - name: misc

paths:
  /auth/mode:
    get:
      tags: [auth]
      summary: 로그인 방식 (D34 — local 기본, oidc는 후속 페이즈 SSO)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [local, oidc] } } } } } }
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입 (local 모드) — ID·비밀번호만, 가입 즉시 세션 쿠키
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '201': { description: 가입·로그인됨, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { description: ID·비밀번호 규칙 위반 }
        '404': { description: local 모드가 아님 }
        '409': { description: 이미 사용 중인 ID }
  /auth/login:
    post:
      tags: [auth]
      summary: 로그인 (local 모드) — 세션 쿠키 발급
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: 로그인됨, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: ID 또는 비밀번호 불일치 (구분하지 않음) }
        '404': { description: local 모드가 아님 }
    get:
      tags: [auth]
      summary: SSO 로그인 시작 (oidc 모드, IdP로 리다이렉트)
      security: []
      responses:
        '302': { description: IdP로 이동 }
        '404': { description: oidc 모드가 아님 }
  /auth/callback:
    get:
      tags: [auth]
      summary: SSO 콜백 → 세션 쿠키 발급 (OIDC 코드 또는 SAML POST는 서버 설정에 따름)
      security: []
      responses:
        '302': { description: 앱으로 이동 }
  /auth/logout:
    post:
      tags: [auth]
      responses:
        '204': { description: 로그아웃 }
  /me:
    get:
      tags: [auth]
      summary: 현재 사용자와 역할·테마·언어 프로필
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /catalog/users:
    get:
      tags: [misc]
      summary: 사용자 목록 (로그인 사용자 전원 — 담당자·소유자 표시용). S4 ①에서 /users에서 이동
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogUser' } } } } }
  /users:
    get:
      tags: [admin]
      summary: 계정 관리 목록 (SO 전용 — 역할·활성·변경 강제 상태 포함). S4 ①
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /users/me:
    patch:
      tags: [admin]
      summary: 본인 프로필 변경 — 이름·테마·언어 (U2). SO도 타인의 테마·언어는 변경할 수 없다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 40, description: 앞뒤 공백 제거 후 검증 }
                theme: { $ref: '#/components/schemas/Theme' }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200': { description: 저장된 프로필, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /users/{userId}:
    patch:
      tags: [admin]
      summary: 사용자 이름 변경 (SO 전용). 테마·언어는 허용하지 않는다
      parameters: [{ $ref: '#/components/parameters/userId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 40 } } } } } }
      responses:
        '200': { description: 변경된 이름, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /users/{userId}/system-owner:
    put:
      tags: [admin]
      summary: SO 지정·해제 (SO 전용). 마지막 활성 SO 해제는 409
      parameters: [{ $ref: '#/components/parameters/userId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: boolean } } } } } }
      responses:
        '204': { description: 변경됨 }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{userId}/business-owner:
    put:
      tags: [admin]
      summary: BO(요청자) 지정·해제 (SO 전용, D37). S4 ①
      parameters: [{ $ref: '#/components/parameters/userId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: boolean } } } } } }
      responses: { '204': { description: 변경됨 } }
  /users/{userId}/active:
    put:
      tags: [admin]
      summary: 계정 활성·비활성 (SO 전용). 비활성은 로그인 거부·세션 무효. 마지막 활성 SO 비활성화는 409. S4 ①
      parameters: [{ $ref: '#/components/parameters/userId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: boolean } } } } } }
      responses: { '204': { description: 변경됨 }, '409': { $ref: '#/components/responses/Problem' } }
  /users/{userId}/temporary-password:
    post:
      tags: [admin]
      summary: 임시 비밀번호 발급 (SO 전용, S4-1). 응답에 1회만 노출·DB에는 해시만, 기존 세션 삭제, 다음 로그인 때 변경 강제(mustChangePassword)
      parameters: [{ $ref: '#/components/parameters/userId' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, required: [temporaryPassword], properties: { temporaryPassword: { type: string } } } } } } }
  /auth/password:
    post:
      tags: [auth]
      summary: 본인 비밀번호 변경 (현재 비밀번호 확인, 다른 세션 무효화). 변경 강제 상태에서는 이 API와 /auth/logout·/me 외 403 PASSWORD_CHANGE_REQUIRED. S4 ①
      requestBody: { content: { application/json: { schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { $ref: '#/components/schemas/Password' } } } } } }
      responses: { '204': { description: 변경됨 }, '400': { $ref: '#/components/responses/Problem' } }

  /assistants:
    get:
      tags: [assistants]
      summary: 에이전트 카탈로그 (공통 순서)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assistant' } } } } }
    post:
      tags: [assistants]
      summary: 에이전트 추가 (SO 전용). id 생략 시 서버가 a- 접두의 짧은 무작위 ID 생성
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AssistantInput' } } } }
      responses:
        '201': { description: 생성, content: { application/json: { schema: { $ref: '#/components/schemas/Assistant' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /assistants/stats:
    get:
      tags: [assistants]
      summary: 카드별 대화 집계 (S2 ①)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, required: [assistantId, open, inProgress, onHold, done], properties: { assistantId: { type: string }, open: { type: integer }, inProgress: { type: integer }, onHold: { type: integer }, done: { type: integer } } } } } } }
  /codes:
    post:
      tags: [admin]
      summary: 코드 추가 (SO 전용, S4-2). 그룹은 시스템 정의 — 새 그룹은 만들 수 없다
      requestBody: { content: { application/json: { schema: { type: object, required: [groupKey, code, name], properties: { groupKey: { type: string }, code: { type: string }, name: { type: string }, sortOrder: { type: integer } } } } } }
      responses: { '201': { description: 생성 }, '403': { $ref: '#/components/responses/Problem' }, '409': { description: '코드 키 중복 또는 그룹 내 정규화 이름 충돌(비활성 코드 포함)' } }
    get:
      tags: [misc]
      summary: 코드 목록 (FR-63, D36 — active만; group으로 필터. includeInactive=true는 SO 전용)
      parameters: [{ name: group, in: query, schema: { type: string, description: 'code_group.key (예 assistant_level1)' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, required: [id, groupKey, code, name, sortOrder, active, isAuto], properties: { id: { type: string }, groupKey: { type: string }, code: { type: string }, name: { type: string }, sortOrder: { type: integer }, active: { type: boolean }, isAuto: { type: boolean, description: 자동 생성 여부. 기존·수동 코드는 false } } } } } } }
  /codes/manage:
    get:
      tags: [admin]
      summary: 코드 관리 목록 (SO 전용 — 비활성 포함)
      parameters: [{ name: group, in: query, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /codes/{codeId}:
    patch:
      tags: [admin]
      summary: 코드 수정 (SO 전용) — 이름·순서·활성. 수동 삭제 없음(참조 무결성). 비활성 코드 ID는 새 선택 불가하고 이름 입력은 재활성
      parameters: [{ name: codeId, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, sortOrder: { type: integer }, active: { type: boolean } } } } } }
      responses: { '204': { description: 변경됨 }, '409': { description: '그룹 내 다른 코드와 정규화 이름 충돌(비활성 코드 포함)' } }
  /assistants/{assistantId}/image:
    post:
      tags: [assistants]
      summary: 에이전트 이미지 업로드·교체 (SO 전용, S4-3). 이전 이미지는 소프트 삭제. 열람은 로그인 사용자 전원(파일 API)
      parameters: [{ $ref: '#/components/parameters/assistantId' }]
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [assistants]
      summary: 에이전트 이미지 제거 (SO 전용)
      parameters: [{ $ref: '#/components/parameters/assistantId' }]
      responses: { '204': { description: 제거 } }
  /assistants/{assistantId}:
    patch:
      tags: [assistants]
      summary: 에이전트 수정 (SO 전용). 부분 수정은 기대 입출력·체크리스트를 보존. 접수 에이전트는 중단 불가(409)
      parameters: [{ $ref: '#/components/parameters/assistantId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AssistantPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Assistant' } } } }
    delete:
      tags: [assistants]
      summary: 삭제 (SO 전용, 대화가 있거나 SR 접수 에이전트면 409)
      parameters: [{ $ref: '#/components/parameters/assistantId' }]
      responses:
        '204': { description: 삭제 }
        '409': { $ref: '#/components/responses/Problem' }
  /assistants/order:
    put:
      tags: [assistants]
      summary: 공통 순서 저장 (SO 전용). 행을 ID 순으로 잠근 뒤 revisions(에이전트별)와 비교 — 하나라도 다르면 409
      requestBody: { content: { application/json: { schema: { type: object, required: [ids, revisions], properties: { ids: { type: array, items: { type: string } }, revisions: { type: object, additionalProperties: { type: integer } } } } } } }
      responses:
        '204': { description: 저장 }
        '409': { $ref: '#/components/responses/Problem' }

  /tasks:
    get:
      tags: [tasks]
      summary: 대화 목록 (칸반·검색)
      parameters:
        - { name: assistantId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TaskStatus' } } }
        - { name: tag, in: query, schema: { type: array, items: { type: string } } }
        - { name: mine, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Task' } } } } }
    post:
      tags: [tasks]
      summary: 대화 시작 (첫 전송·첨부 때 호출, 코드는 서버 발급)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [assistantId]
              properties:
                assistantId: { type: string }
                tags: { type: array, items: { type: string } }
                title: { type: string }
                inputFileIds: { type: array, items: { type: string } }
                referenceTaskId: { type: string, description: '?ref= — 이 대화를 ★ 참조 대화(전체 원문)로 미리 선택. 태그를 직접 공유하지 않거나 전달할 메시지가 없으면 선택하지 않고 응답의 warnings[]로 알린다 (S3 ②)' }
                firstMessage: { type: string, description: '첫 팀 의견 — 있으면 대화·스레드와 같은 트랜잭션에 kind=discussion 메시지(seq 1)로 저장 (S2 ②)' }
      responses:
        '201': { description: '생성. 참조 대화를 선택하지 못했으면 Task에 warnings(string[])가 붙는다', content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /tasks/{taskId}:
    get:
      tags: [tasks]
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    patch:
      tags: [tasks]
      summary: 제목·요약·우선순위·기한·담당자 (수동 제목은 AI가 덮어쓰지 않음)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TaskPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    delete:
      tags: [tasks]
      summary: 삭제 (파일·대화가 다른 대화에서 쓰이면 409)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        '204': { description: 삭제 }
        '409': { $ref: '#/components/responses/Problem' }
  /tasks/{taskId}/checklist:
    get:
      tags: [tasks]
      summary: 체크리스트 (대화 생성 시 에이전트 템플릿 복사. 강제 아님 — 완료를 막지 않는다). S4 ③
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: OK } }
    post:
      tags: [tasks]
      summary: 항목 추가 (완료된 대화는 409)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [label], properties: { label: { type: string }, required: { type: boolean } } } } } }
      responses: { '201': { description: 추가 }, '409': { $ref: '#/components/responses/Problem' } }
  /tasks/{taskId}/checklist/{itemId}:
    patch:
      tags: [tasks]
      summary: 체크 토글
      parameters: [{ $ref: '#/components/parameters/taskId' }, { name: itemId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: 변경 } }
    delete:
      tags: [tasks]
      summary: 항목 삭제 (저장된 AI 판단 결과는 무효화)
      parameters: [{ $ref: '#/components/parameters/taskId' }, { name: itemId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: 삭제 } }
  /tasks/{taskId}/checklist/review:
    post:
      tags: [tasks]
      summary: AI 달성도 m/n (보조 호출 — 요청 기록 없음, D3-2). 체크는 건드리지 않고 판단만 저장
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: 'met · total · items[{ itemId, met, note }]' } }
  /tasks/{taskId}/checklist/review/apply:
    post:
      tags: [tasks]
      summary: '"판단대로 체크" — AI가 충족이라 본 항목만 체크'
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: 체크한 수 } }
  /tasks/{taskId}/notes:
    get:
      tags: [tasks]
      summary: 노트 목록 (첨부는 자료함 파일 참조, 삭제된 대화는 404). S4 ③
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: OK } }
    post:
      tags: [tasks]
      summary: 노트 추가 (본문 + 자료함 파일 ID)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string }, attachmentIds: { type: array, items: { type: string } } } } } } }
      responses: { '201': { description: 추가 } }
  /tasks/{taskId}/notes/{noteId}:
    delete:
      tags: [tasks]
      summary: 노트 삭제 (작성자·SO)
      parameters: [{ $ref: '#/components/parameters/taskId' }, { name: noteId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: 삭제 } }
  /tasks/{taskId}/complete/preview:
    post:
      tags: [tasks]
      summary: 완료 리포트 미리보기 (데모 buildTaskReport 형식 — 입력 출처·참조 대화·산출물·피드백·완료 사유)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { feedback: { type: object, properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } } }, reason: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { description: 'markdown' } }
  /tasks/{taskId}/complete:
    post:
      tags: [tasks]
      summary: 완료 — 피드백 저장 · 리포트를 산출물 파일(`완료리포트_<코드>.md`, 버전 체인)로 저장 · 상태 done, 한 트랜잭션. status API의 done도 같은 경로. 필수 체크 항목이 미완료면 reason 필수(400)이고 리포트·task.completed 이력(payload.reason)에 기록 (S4 ③, U9)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { feedback: { type: object, properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } } }, reason: { type: string, maxLength: 500, description: '필수 체크 미완료 시 필수' } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /tasks/{taskId}/status:
    post:
      tags: [tasks]
      summary: 상태 변경 (완료는 리포트 저장·진행 중 요청 있으면 409, 재개는 사유 필수)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/TaskStatus' }, reason: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /tasks/{taskId}/tags/{tag}:
    put:
      tags: [tasks]
      parameters: [{ $ref: '#/components/parameters/taskId' }, { name: tag, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: 추가(정규화·중복 무시) } }
    delete:
      tags: [tasks]
      summary: 태그 제거 (이미 고른 입력은 유지)
      parameters: [{ $ref: '#/components/parameters/taskId' }, { name: tag, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: 제거 } }

  /tasks/{taskId}/candidates:
    get:
      tags: [materials]
      summary: 같은 태그를 직접 공유하는 대화의 파일·대화 후보 (간접 연결 제외, 대화는 최근 활동순)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: array, items: { $ref: '#/components/schemas/PoolItem' } }
                  conversations: { type: array, items: { $ref: '#/components/schemas/ConversationCandidate' } }
  /tasks/{taskId}/inputs/{fileId}:
    put:
      tags: [materials]
      summary: 파일을 입력으로 선택·등급 변경 (특정 버전 고정)
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/fileId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [weight], properties: { weight: { $ref: '#/components/schemas/InputWeight' } } } } } }
      responses:
        '204': { description: 선택 }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [materials]
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/fileId' }]
      responses: { '204': { description: 해제 } }
  /tasks/{taskId}/inputs/{fileId}/switch-version:
    post:
      tags: [materials]
      summary: 선택을 다른 버전으로 (사람이 누를 때만)
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/fileId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [toFileId], properties: { toFileId: { type: string } } } } } }
      responses: { '204': { description: 변경 } }
  /tasks/{taskId}/conversation-inputs:
    get:
      tags: [materials]
      summary: 고른 참조 대화 (스냅샷·새 메시지 수·태그 해제 여부·크기)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConversationInput' } } } } }
  /tasks/{taskId}/conversation-inputs/{sourceTaskId}:
    put:
      tags: [materials]
      summary: 참조 대화 선택 (전체·메시지 선택·요약). 같은 쌍은 스냅샷만 교체
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/sourceTaskId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ConversationInputRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationInput' } } } }
        '400': { description: 'code: SELF_REFERENCE(자기 대화) · INVALID_MESSAGE_IDS(원본에 없는·중복·부적격 메시지)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'code: TAG_NOT_SHARED(태그를 직접 공유하지 않음) · TASK_DONE(완료된 대화)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    patch:
      tags: [materials]
      summary: 등급 변경
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/sourceTaskId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [weight], properties: { weight: { $ref: '#/components/schemas/InputWeight' } } } } } }
      responses: { '204': { description: 변경 } }
    delete:
      tags: [materials]
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/sourceTaskId' }]
      responses: { '204': { description: 해제 (스냅샷은 요청 기록을 위해 보존) } }
  /tasks/{taskId}/conversation-inputs/{sourceTaskId}/refresh:
    post:
      tags: [materials]
      summary: 전체 원문 모드를 새 메시지까지 다시 고정
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/sourceTaskId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationInput' } } } }
  /tasks/{taskId}/conversation-inputs/{sourceTaskId}/summary-draft:
    post:
      tags: [materials]
      summary: 요약 초안 생성 (보조 요청, 적용 전 사람이 확인·수정). 원문이 한도를 넘으면 413
      parameters: [{ $ref: '#/components/parameters/taskId' }, { $ref: '#/components/parameters/sourceTaskId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { messageIds: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { text: { type: string }, source: { enum: [ai, rule] }, model: { type: string } } } } } }
        '413': { $ref: '#/components/responses/Problem' }

  /threads/{threadId}/messages:
    get:
      tags: [requests]
      parameters: [{ $ref: '#/components/parameters/threadId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } }
    post:
      tags: [requests]
      summary: 팀 의견 (AI에 보내지 않음) — S2에서는 kind=discussion만 허용, AI 요청은 /requests(S3)
      parameters: [{ $ref: '#/components/parameters/threadId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [content, kind], properties: { content: { type: string }, kind: { type: string, enum: [discussion] }, attachmentIds: { type: array, items: { type: string }, description: 'S2 ③부터' } } } } } }
      responses:
        '201': { description: 생성, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { description: kind가 discussion이 아님 }
  /tags/suggest:
    get:
      tags: [tasks]
      summary: 태그 자동완성 (빈도순 + 접수 SR 코드 — SR은 S4부터)
      parameters: [{ name: prefix, in: query, schema: { type: string } }, { name: exclude, in: query, schema: { type: array, items: { type: string } } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, required: [tag], properties: { tag: { type: string }, count: { type: integer }, kind: { type: string } } } } } } }
  /tasks/{taskId}/activity:
    get:
      tags: [tasks]
      summary: 활동 이력 (추가만, 최신순)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActivityLog' } } } } }
  /threads/{threadId}/requests/estimate:
    post:
      tags: [requests]
      summary: 지금 보내면 AI가 받을 것 (트레이) — 실제 전송과 같은 조립 함수(dryRun)·같은 입력 상태. 완료 대화도 조회 가능(전송만 차단). S3 ③
      parameters: [{ $ref: '#/components/parameters/threadId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { draft: { type: string }, attachmentIds: { type: array, items: { type: string }, description: '업로드했지만 아직 고정하지 않은 초안 첨부 — 전송 시 규칙대로 ☑ 고정될 것으로 가정' }, oneShotFileIds: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: 'RequestInfo + overLimit(초과면 전송 차단 — 자동 절단·요약 없음) · limitBytes · attachmentLimit', content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/RequestInfo' }, { type: object, properties: { overLimit: { type: boolean }, limitBytes: { type: integer }, attachmentLimit: { type: integer } } }] } } } }
  /threads/{threadId}/requests:
    post:
      tags: [requests]
      summary: AI 요청 시작 — 응답은 SSE. 진행 중 요청 409 REQUEST_ACTIVE, 완료 대화 409 TASK_DONE, 첨부 개수 초과 413 ATTACHMENT_LIMIT(행 없음). 요청 크기 초과는 커밋 후 failed(REQUEST_TOO_LARGE)로 기록 + SSE failed. S3-design §1.3·§8
      parameters: [{ $ref: '#/components/parameters/threadId' }, { name: Idempotency-Key, in: header, required: true, schema: { type: string }, description: '전송 시도마다 클라이언트 UUID. 같은 키 재호출은 새 행 없이 기존 요청 스트림 재개 (S3-design §8.1)' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                attachmentIds: { type: array, items: { type: string } }
                oneShotFileIds: { type: array, items: { type: string }, description: 대화 입력으로 고정하지 않는 첨부 }
      responses:
        '200':
          description: |
            text/event-stream. 이벤트: `started`({requestId, replyMessageId}), `phase`({text}), `delta`({text}),
            `completed`({requestInfo}), `failed`({error, requestInfo}) — failed의 requestInfo.inputs에 전달 실패 항목
          content: { text/event-stream: { schema: { type: string } } }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /requests/{requestId}:
    get:
      tags: [requests]
      summary: 전송 기록 (사용한 자료·전달 방식·크기·모델·status·phase·retryOf). pending이면 bytes는 null(준비 중)
      parameters: [{ $ref: '#/components/parameters/requestId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RequestRecord' } } } }
  /requests/{requestId}/snapshot:
    get:
      tags: [requests]
      summary: 원본 요청 JSON (키 제외)
      parameters: [{ $ref: '#/components/parameters/requestId' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } } }
  /requests/{requestId}/retry:
    post:
      tags: [requests]
      summary: 같은 사용자 메시지로 다시 요청 (failed·cancelled·interrupted이고 스레드의 마지막 비-팀의견 답변만 — 아니면 409 NOT_FAILED/NOT_LATEST). excludeFileIds·forceInlineFileIds는 원 첨부·현재 선택에 속해야 함(400 INVALID_RETRY_INPUT)
      parameters: [{ $ref: '#/components/parameters/requestId' }, { name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                excludeFileIds: { type: array, items: { type: string }, description: 입력에서 빼고 다시 }
                forceInlineFileIds: { type: array, items: { type: string }, description: 텍스트로 보내기 (텍스트 파일만) }
      responses:
        '200': { description: text/event-stream (시작과 같음), content: { text/event-stream: { schema: { type: string } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /requests/{requestId}/cancel:
    post:
      tags: [requests]
      parameters: [{ $ref: '#/components/parameters/requestId' }]
      responses: { '204': { description: 중지 (부분 응답 보존) } }

  /files:
    post:
      tags: [files]
      summary: 업로드 (같은 대화·같은 이름이면 새 버전). 서버가 storage_key 생성
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, originTaskId]
              properties:
                file: { type: string, format: binary }
                originTaskId: { type: string, description: '이 대화의 파일 (S2 ③). SR 첨부(originSrId)는 S4' }
                isOutput: { type: boolean, description: '업로드와 동시에 산출물 표시' }
      responses:
        '201': { description: 생성, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }
        '413': { $ref: '#/components/responses/Problem' }
  /files/{fileId}:
    get:
      tags: [files]
      summary: 메타데이터 (요청자는 본인 SR 첨부·본인 SR에 공유된 결과 파일만 — 다운로드와 같은 범위, 그 밖은 403)
      parameters: [{ $ref: '#/components/parameters/fileId' }]
      responses:
        '200': { description: 파일 메타, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [files]
      summary: 산출물 표시
      parameters: [{ $ref: '#/components/parameters/fileId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { isOutput: { type: boolean } } } } } }
      responses: { '204': { description: 변경 } }
    delete:
      tags: [files]
      summary: 소프트 삭제 (다른 대화가 입력으로 쓰면 409)
      parameters: [{ $ref: '#/components/parameters/fileId' }]
      responses:
        '204': { description: 삭제 }
        '409': { $ref: '#/components/responses/Problem' }
  /files/{fileId}/content:
    get:
      tags: [files]
      summary: 원본 다운로드 (스트리밍)
      parameters: [{ $ref: '#/components/parameters/fileId' }]
      responses: { '200': { description: 파일, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }
  /files/{fileId}/versions:
    get:
      tags: [files]
      parameters: [{ $ref: '#/components/parameters/fileId' }]
      responses:
        '200': { description: 최신 → 과거, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FileMeta' } } } } }
  /tasks/{taskId}/outputs:
    post:
      tags: [files]
      summary: 답변을 마크다운 산출물로 저장 (같은 이름이면 새 버전)
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [name, content], properties: { name: { type: string }, content: { type: string, description: '마크다운 본문 (S2 ③: 클라이언트가 답변 본문을 넘김. messageId 연결은 S3)' } } } } } }
      responses:
        '201': { description: 생성, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }

  /service-requests:
    get:
      tags: [service-requests]
      summary: SR 목록 — mine은 본인 요청, inbox는 초안 제외. BO는 scope와 무관하게 mine 강제. 생략 시 기존 범위 유지.
      parameters: [{ name: scope, in: query, required: false, schema: { type: string, enum: [mine, inbox] } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ServiceRequest' } } } } }
    post:
      tags: [service-requests]
      summary: 첫 전송 시 SR 초안·접수 대화 생성 (draft, 코드 없음). 같은 actor·키 재전송은 기존 SR 반환.
      parameters: [{ name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 128 }, description: '웹 첫 전송은 필수로 전송. 생략은 기존 클라이언트 호환.' }]
      responses:
        '201': { description: 생성, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceRequest' } } } }
  /service-requests/intake-assistant:
    get:
      tags: [service-requests]
      summary: 접수 에이전트 표시 정보와 첨부 수 제한 (BO도 읽기 가능)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { srIntakeAssistantId: { type: [string, 'null'] }, name: { type: string }, summary: { type: string }, usageExample: { type: string }, fileMaxPerRequest: { type: integer } } } } } }
  /service-requests/{srId}:
    get:
      tags: [service-requests]
      summary: 상세 (결과·연결 업무·접수 첨부·읽기 전용 intakeMessages). BO 요청자 범위 강제. 스레드 쓰기 권한 부여 없음
      parameters: [{ $ref: '#/components/parameters/srId' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceRequest' } } } }, '403': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [service-requests]
      summary: draft 삭제 (draft만)
      parameters: [{ $ref: '#/components/parameters/srId' }]
      responses: { '204': { description: 삭제 }, '409': { $ref: '#/components/responses/Problem' } }
  /service-requests/{srId}/draft:
    get:
      tags: [service-requests]
      summary: 접수 전환용 초안 — 접수 대화에서 제목(보조 호출, 기록 없음)·본문 초안
      parameters: [{ $ref: '#/components/parameters/srId' }]
      responses: { '200': { description: OK } }
  /service-requests/{srId}/title:
    patch:
      tags: [service-requests]
      summary: 제목 수정 (요청자·SO만, 수정은 titleSource=manual)
      parameters: [{ $ref: '#/components/parameters/srId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string } } } } } }
      responses: { '204': { description: 변경 }, '403': { $ref: '#/components/responses/Problem' } }
  /service-requests/{srId}/content:
    patch:
      tags: [service-requests]
      summary: 접수 내용 수정 (제목·본문·첨부 선택)
      parameters: [{ $ref: '#/components/parameters/srId' }]
      responses: { '204': { description: 변경 } }
  /service-requests/{srId}/status:
    patch:
      tags: [service-requests]
      summary: 상태 변경 (담당자·SO) — 요청자에게 한글 라벨 알림. done·rejected는 reason 필수(400), 사유는 activity_log.payload.reason(sr.status_changed)에만 저장 (U9)
      parameters: [{ $ref: '#/components/parameters/srId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { enum: [submitted, reviewing, in_progress, responded, done, rejected] }, reason: { type: string, minLength: 1, maxLength: 500, description: 'done·rejected 필수, 그 외 선택' } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceRequest' } } } }, '400': { $ref: '#/components/responses/Problem' } }
  /service-requests/{srId}/refine:
    post:
      tags: [service-requests]
      summary: 현재 제목·본문을 보조 호출로 다듬은 **제안**만 반환 (요청자·SO, 저장 없음, 기록 없음). 적용·제출은 사람이 한다 (U9)
      parameters: [{ $ref: '#/components/parameters/srId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [title, body], properties: { title: { type: string }, body: { type: string } } } } } }
      responses: { '201': { description: 제안, content: { application/json: { schema: { type: object, properties: { title: { type: string }, body: { type: string } } } } } }, '429': { description: 보조 요청 진행 중 } }
  /service-requests/{srId}/submit:
    post:
      tags: [service-requests]
      summary: 접수로 전환 (SR-YYYY-NNNN 발급·태그·접수 에이전트 소유자 알림)
      parameters: [{ $ref: '#/components/parameters/srId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [title, body], properties: { title: { type: string }, titleSource: { enum: [ai, manual] }, body: { type: string }, attachmentIds: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceRequest' } } } }
  /service-requests/{srId}/tasks:
    post:
      tags: [service-requests]
      summary: 연결 업무 시작 (진행 중 연결 대화가 있으면 forceNew 없이는 후보 반환, draft는 409). 서버가 task.sr_id로 연결을 기록 — SR 처리자 권한의 근거(태그 아님)
      parameters: [{ $ref: '#/components/parameters/srId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [assistantId], properties: { assistantId: { type: string }, forceNew: { type: boolean } } } } } }
      responses:
        '201': { description: 생성, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /service-requests/{srId}/results:
    post:
      tags: [service-requests]
      summary: 요청자에게 결과 공유 (텍스트 또는 파일 1개 이상). 내부 대화는 공유되지 않음. 상태 responded(종료 상태 done·rejected는 유지). 요청자에게 알림
      parameters: [{ $ref: '#/components/parameters/srId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { taskId: { type: string }, text: { type: string }, fileIds: { type: array, items: { type: string } } } } } } }
      responses: { '201': { description: 공유 }, '400': { $ref: '#/components/responses/Problem' } }
    get:
      tags: [service-requests]
      summary: 공유된 결과 목록 — 요청자는 이것과 자기 첨부만 열람(S4-4). 파일 다운로드도 같은 범위로 강제
      parameters: [{ $ref: '#/components/parameters/srId' }]
      responses: { '200': { description: OK } }

  /notifications:
    get:
      tags: [misc]
      summary: 본인 알림 최신순(읽음 여부 포함). 대화 배정(소유자·담당자, 행위자 제외)·SR 접수·상태 변경·결과 공유 4종을 서버가 기록하고 notification.created 이벤트는 수신자에게만 간다. S4 ④
      responses: { '200': { description: OK } }
  /notifications/unread-count:
    get:
      tags: [misc]
      summary: 본인 미읽음 수. S4 ④
      responses: { '200': { description: '{ count }' } }
  /notifications/{id}/read:
    patch:
      tags: [misc]
      summary: 본인 알림 읽음 처리(타인 알림은 404). S4 ④
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Problem' } }
  /notifications/read-all:
    post:
      tags: [misc]
      summary: 본인 알림 모두 읽음. S4 ④
      responses: { '200': { description: OK } }
  /reports:
    get:
      tags: [misc]
      summary: 리포트 집계 단일 응답 — kpi·완료 추이(buckets)·에이전트별·사용자별·자료 흐름(10)·태그(12)·SR 분포·비효율 신호·피드백 다이제스트. 도메인 reporting 함수 재사용, 완료 시각은 task.completed 활동 기준, SR 리드타임은 sr.status_changed 활동 기준, 소프트 삭제 제외. 요청자(BO)는 403. S4 ④
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
        - { name: granularity, in: query, schema: { type: string, enum: [day, week], default: week } }
        - { name: userId, in: query, required: false, schema: { type: string }, description: 소유자 또는 담당자 필터 }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }

  /system-assistant/model:
    get:
      tags: [misc]
      summary: 시스템 assistant 서랍 표시용 — LLM 모드(mock/live)와 기본 모델명. S4 ⑤
      responses: { '200': { description: '{ mode, model }' } }
  /system-assistant/messages:
    post:
      tags: [misc]
      summary: 시스템 assistant 서버 대리 호출(U1(a)). 서랍 이력(user/assistant)을 받아 서버가 시스템 프롬프트·도구 정의(SYSTEM_TOOLS)를 붙여 provider를 호출(mock은 규칙 기반)하고 `{ text, toolCalls }`를 돌려준다. 도구 호출은 **제안**일 뿐 — 웹이 카드로 보여 주고 사용자가 "적용"해야 기존 API(POST /tasks · POST /assistants · 태그 추가)를 같은 권한으로 호출한다. 자동 실행·DB 저장·요청 기록 없음(D3-2). 메시지 수·길이·요청 크기 한도(413), 연결 종료 시 모델 호출 중단, 시간 제한. S4 ⑤
      requestBody: { content: { application/json: { schema: { type: object, required: [messages], properties: { messages: { type: array, items: { type: object, required: [role, content], properties: { role: { type: string, enum: [user, assistant] }, content: { type: string } } } } } } } } }
      responses:
        '200': { description: '{ text, toolCalls: [{ id, name, arguments }] }' }
        '413': { $ref: '#/components/responses/Problem' }
        '502': { description: 모델 응답 실패 }

  /events:
    get:
      tags: [misc]
      summary: 변경 알림 SSE (세션 인증). 이벤트 task.created · task.updated · message.appended · request.updated(status·phase) · file.updated · input.updated · context.updated · presence.typing(until, 저장 없음) · notification.created(S4) · resync. id는 `{bootId}:{seq}`, 15 s 하트비트, 5분/1000건 재전송 버퍼. Last-Event-ID가 범위 밖·bootId 불일치·첫 연결(커서 없음)이면 현재 커서를 담은 resync를 먼저 보낸다(클라이언트는 전체 무효화). 느린 클라이언트(배압)는 연결을 끊는다 — 재접속으로 복구. S3 ③ · S3-design §3.3
      parameters: [{ name: Last-Event-ID, in: header, required: false, schema: { type: string } }]
      responses: { '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } } }
  /threads/{threadId}/typing:
    post:
      tags: [misc]
      summary: '"입력 중" 신호 — presence.typing 이벤트 발행(until = +5 s), 저장 없음. S3 ③'
      parameters: [{ $ref: '#/components/parameters/threadId' }]
      responses: { '204': { description: 발행 } }
  /settings:
    get:
      tags: [misc]
      summary: 전역 설정 조회 (로그인 사용자 전원 — 웹이 기본 모델·한도를 표시). S4 ①
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } }
    patch:
      tags: [misc]
      summary: 전역 설정 (SO 전용). OpenWebUI 키는 여기서 다루지 않음(서버 비밀)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: hub_session }
  parameters:
    userId: { name: userId, in: path, required: true, schema: { type: string } }
    assistantId: { name: assistantId, in: path, required: true, schema: { type: string } }
    taskId: { name: taskId, in: path, required: true, schema: { type: string } }
    sourceTaskId: { name: sourceTaskId, in: path, required: true, schema: { type: string } }
    threadId: { name: threadId, in: path, required: true, schema: { type: string } }
    requestId: { name: requestId, in: path, required: true, schema: { type: string } }
    fileId: { name: fileId, in: path, required: true, schema: { type: string } }
    srId: { name: srId, in: path, required: true, schema: { type: string } }
  responses:
    Problem:
      description: 오류 (RFC 9457)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Credentials:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string, pattern: '^[a-z0-9._-]{3,32}$', description: 로그인 ID = 계정 식별자 (D34) }
        password: { type: string, minLength: 8, maxLength: 128 }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: 화면에 그대로 보여 줄 한국어 설명 }
        code: { type: string, enum: [active_request, task_done, in_use, budget_exceeded, delivery_failed, forbidden, conflict, not_found, validation] }
    Theme: { type: string, enum: [system, light, dark], default: system }
    Locale: { type: string, enum: [ko, en], default: ko }
    UserProfile:
      type: object
      required: [name, theme, locale]
      properties:
        name: { type: string }
        theme: { $ref: '#/components/schemas/Theme' }
        locale: { $ref: '#/components/schemas/Locale' }
    CatalogUser:
      type: object
      required: [id, name, initials, color, isSystemOwner, isBusinessOwner]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        color: { type: string }
        isSystemOwner: { type: boolean }
        isBusinessOwner: { type: boolean }
    ManagedUser:
      type: object
      required: [id, loginId, name, active, isSystemOwner, isBusinessOwner, mustChangePassword]
      properties:
        id: { type: string }
        loginId: { type: [string, 'null'] }
        name: { type: string }
        active: { type: boolean }
        isSystemOwner: { type: boolean }
        isBusinessOwner: { type: boolean }
        mustChangePassword: { type: boolean }
    User:
      type: object
      required: [id, name, role, roles, theme, locale]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        roles: { type: array, items: { enum: [member, system_owner, requester] } }
        theme: { $ref: '#/components/schemas/Theme' }
        locale: { $ref: '#/components/schemas/Locale' }
        mustChangePassword: { type: boolean }
    InputWeight: { type: string, enum: [main, reference] }
    ContextMode: { type: string, enum: [full, messages, summary] }
    TaskStatus: { type: string, enum: [todo, in_progress, on_hold, done] }
    Assistant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        level1: { type: string }
        level2: { type: string }
        summary: { type: string }
        order: { type: integer }
        modelId: { type: string }
        link1: { type: string }
        docUrl: { type: string }
        ownerId: { type: string }
        status: { enum: [open, developing, testing, retired] }
        usageExample: { type: string }
        imageFileId: { type: string }
        expectedInputs: { type: array, items: { type: string } }
        expectedOutputs: { type: array, items: { type: string } }
        checklistTemplate: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, required: { type: boolean } } } }
    AssistantInput:
      allOf:
        - $ref: '#/components/schemas/AssistantPatch'
        - type: object
          required: [name, summary, ownerId, status, usageExample, expectedInputs, expectedOutputs]
          allOf:
            - anyOf: [{ required: [level1] }, { required: [level1CodeId] }]
            - anyOf: [{ required: [level2] }, { required: [level2CodeId] }]
          properties:
            id: { type: string, minLength: 1, maxLength: 191, description: '선택. 생략 시 서버 생성(a- + 무작위 12자리 hex). 기존 ID는 유지.' }
    AssistantPatch:
      type: object
      description: '부분 수정. 내부 ID는 변경 불가. 생략한 필드는 유지. level1·level2 이름은 trim·연속 공백 1개·NFC로 정규화하고 그룹 내 대소문자 무시 비교한다. 같은 트랜잭션에서 기존 코드 조회·재활성 또는 자동 생성하고 분류 변경·삭제 후 미참조 자동 코드만 정리한다. 이름과 ID를 함께 주면 ID가 우선하며 이름을 재매칭하지 않는다. 이름에 일치하는 코드가 여러 행이면 409. 신규 코드 ID(group:정규화 이름)는 191자 이하이며 키 충돌 시 이름을 유지하고 키에 숫자 접미사를 붙인다. 접미사가 길이 한도를 넘으면 키 앞부분만 줄인다.'
      properties:
        name: { type: string, minLength: 1, maxLength: 1000 }
        level1: { type: string, minLength: 1, maxLength: 191, description: 분류 1 이름 }
        level2: { type: string, minLength: 1, maxLength: 191, description: 분류 2 이름 }
        level1CodeId: { type: string, minLength: 1, maxLength: 191, description: '분류 1 코드 ID. 기존 참조 유지 시 비활성 코드도 허용.' }
        level2CodeId: { type: string, minLength: 1, maxLength: 191, description: '분류 2 코드 ID. 기존 참조 유지 시 비활성 코드도 허용.' }
        summary: { type: string }
        ownerId: { type: string, minLength: 1, maxLength: 191 }
        status: { enum: [open, developing, testing, retired] }
        usageExample: { type: string, description: 첫 질문 예시 }
        modelId: { type: [string, 'null'] }
        link1: { type: [string, 'null'], description: 'OpenWebUI 링크. 비우면 link1Rule 사용. modelId·link1이 모두 없으면 링크 숨김. 규칙의 {assistantId}는 호환 유지.' }
        docUrl: { type: [string, 'null'] }
        expectedInputs: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        expectedOutputs: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        checklistTemplate: { type: array, maxItems: 100, items: { type: object, required: [id, label, required], properties: { id: { type: string, minLength: 1, maxLength: 191 }, label: { type: string, minLength: 1, maxLength: 1000 }, required: { type: boolean } } } }
    Task:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        assistantId: { type: string }
        title: { type: string }
        titleSource: { enum: [default, ai, manual] }
        summary: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        ownerId: { type: string }
        assigneeIds: { type: array, items: { type: string } }
        priority: { enum: [low, normal, high, urgent] }
        dueDate: { type: string, format: date }
        tags: { type: array, items: { type: string } }
        inputs: { type: array, items: { type: object, properties: { fileId: { type: string }, weight: { $ref: '#/components/schemas/InputWeight' }, selectedAt: { type: string, format: date-time }, selectedBy: { type: string } } } }
        threadId: { type: string }
        modelId: { type: string }
        lastActivityAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    TaskPatch:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        priority: { enum: [low, normal, high, urgent] }
        dueDate: { type: string, format: date }
        assigneeIds: { type: array, items: { type: string } }
        modelId: { type: string }
    FileMeta:
      type: object
      properties:
        id: { type: string }
        kind: { enum: [task_file, sr_attachment, assistant_image] }
        originTaskId: { type: string }
        originSrId: { type: string }
        name: { type: string }
        mime: { type: string }
        size: { type: integer }
        sha256: { type: string }
        source: { enum: [upload, assistant] }
        isOutput: { type: boolean }
        version: { type: integer }
        previousId: { type: string }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
    PoolItem:
      type: object
      properties:
        file: { $ref: '#/components/schemas/FileMeta' }
        sourceTaskId: { type: string }
        viaTags: { type: array, items: { type: string } }
        role: { enum: [output, upload] }
        newerVersionId: { type: string }
        olderVersionIds: { type: array, items: { type: string } }
    ConversationCandidate:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }
        viaTags: { type: array, items: { type: string } }
        messageCount: { type: integer }
        bytes: { type: integer }
    ConversationInputRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/ContextMode' }
        weight: { $ref: '#/components/schemas/InputWeight' }
        messageIds: { type: array, items: { type: string }, description: 'messages: 전달할 메시지, summary: 요약에 쓴 원본' }
        summary: { type: object, properties: { text: { type: string }, source: { enum: [ai, rule] }, model: { type: string } } }
    ConversationInput:
      type: object
      properties:
        id: { type: string }
        taskId: { type: string }
        sourceTaskId: { type: string }
        weight: { $ref: '#/components/schemas/InputWeight' }
        mode: { $ref: '#/components/schemas/ContextMode' }
        snapshotId: { type: string }
        messageCount: { type: integer }
        newMessages: { type: integer, description: 선택 이후 원본에 생긴 메시지 수 (갱신 안내) }
        detached: { type: boolean, description: 공유 태그가 없어졌지만 선택은 유지 }
        bytes: { type: integer }
        summaryText: { type: string }
    Message:
      type: object
      properties:
        id: { type: string }
        threadId: { type: string }
        seq: { type: integer }
        role: { enum: [system, user, assistant] }
        kind: { enum: [discussion] }
        content: { type: string }
        authorId: { type: string }
        status: { enum: [streaming, done, error] }
        error: { type: string }
        attachmentIds: { type: array, items: { type: string } }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    RequestInput:
      type: object
      properties:
        kind: { enum: [file, conversation] }
        weight: { $ref: '#/components/schemas/InputWeight' }
        fileId: { type: string }
        name: { type: string }
        version: { type: integer }
        source: { type: string }
        oneShot: { type: boolean }
        delivery: { enum: [attached, inline, metadata_only, failed] }
        text: { type: boolean, description: 텍스트 파일이면 "텍스트로 보내기" 가능 }
        remoteId: { type: string }
        error: { type: string }
        sourceTaskId: { type: string }
        code: { type: string }
        mode: { $ref: '#/components/schemas/ContextMode' }
        snapshotId: { type: string }
        messageCount: { type: integer }
        bytes: { type: integer }
    RequestInfo:
      type: object
      properties:
        provider: { enum: [mock, live] }
        transport: { enum: [inline, openwebui] }
        model: { type: string }
        bytes: { type: integer }
        limitBytes: { type: integer }
        srCodes: { type: array, items: { type: string } }
        inputs: { type: array, items: { $ref: '#/components/schemas/RequestInput' } }
    RequestRecord:
      allOf:
        - { $ref: '#/components/schemas/RequestInfo' }
        - type: object
          properties:
            id: { type: string }
            threadId: { type: string }
            userMessageId: { type: string }
            replyMessageId: { type: string }
            requestedBy: { type: string }
            retryOf: { type: string }
            status: { enum: [pending, streaming, succeeded, failed, cancelled, interrupted] }
            error: { type: string }
            createdAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
    ServiceRequest:
      type: object
      properties:
        id: { type: string }
        firstMessage: { type: string, description: 제목이 없는 목록의 첫 사용자 메시지 40자 }
