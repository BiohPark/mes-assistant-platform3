name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 20
    name: typecheck · lint · test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  setup-guide:
    timeout-minutes: 30
    # docs/setup/windows.md의 ```powershell ci 블록을 그대로 실행 — 문서와 실제가 어긋나면 실패
    # (MariaDB는 문서 4장 (b) "직접 설치" 경로. Windows 러너는 리눅스 컨테이너를 못 돌려 Keycloak·E2E는 제외)
    name: 설치 가이드 검증 (windows.md)
    runs-on: windows-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # root는 비밀번호 없이 뜬다. 문서의 사람용 절차는 4장 (b)의 $env:MYSQL_PWD 줄로 설치 때 정한 비밀번호를 준다.
      - uses: ankane/setup-mariadb@v1
        with:
          mariadb-version: '11.8'
      - run: mariadb -u root -e "select version()"
      - run: node scripts/run-doc-commands.mjs docs/setup/windows.md

  db:
    timeout-minutes: 20
    name: DB 통합 테스트 (MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11.8 = 기준(LTS), 10.4 = 호환 하한 — docs/next-project/db-mariadb-plan.md
        mariadb: ['11.8', '10.4']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_DATABASE: mes_hub
          MARIADB_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: mes_hub
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pci-only-password --silent"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      # 테스트는 임시 DB(t_*)를 만들고 지운다 — CI는 root로 붙는다(서비스 컨테이너에는 초기화 스크립트를 못 싣는다)
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/mes_hub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  e2e:
    timeout-minutes: 30
    name: E2E (docker compose + Playwright, ${{ matrix.llm_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mock: 기본 시나리오 · live: 가짜 OpenWebUI로 파일 전달 시나리오(requests-live.spec) — S3-design §1.7
        llm_mode: [mock, live]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      - run: docker compose up -d --wait
      - run: pnpm --filter @mes/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          LLM_MODE: ${{ matrix.llm_mode }}
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.llm_mode }}
          path: e2e/test-results

  e2e-windows:
    timeout-minutes: 30
    name: E2E (windows, mock)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ankane/setup-mariadb@v1
        with:
          mariadb-version: '11.8'
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      - name: Set up MariaDB for E2E
        run: |
          mariadb -u root -e "CREATE DATABASE mes_hub CHARACTER SET utf8mb4 COLLATE utf8mb4_nopad_bin;"
          mariadb -u root -e "CREATE USER 'mes'@'localhost' IDENTIFIED BY 'dev-mariadb-password', 'mes'@'%' IDENTIFIED BY 'dev-mariadb-password';"
          mariadb -u root -e "GRANT ALL PRIVILEGES ON mes_hub.* TO 'mes'@'localhost', 'mes'@'%';"
          mariadb -u root -e 'GRANT ALL PRIVILEGES ON `t\_%`.* TO ''mes''@''localhost'', ''mes''@''%'';'
      - run: pnpm --filter @mes/e2e exec playwright install chromium
      - run: pnpm test:e2e
        env:
          LLM_MODE: mock
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows-mock
          path: e2e/test-results
